# USD per 1M tokens, standard (non-batch) list prices, retrieved 2026-10-12. Sources in docs/pricing.md.
# batch_discount: multiplier applied when batch mode is used (all three vendors list 50% batch pricing).
openai:
  gpt-5.4-mini: {input: 0.75, output: 4.50, batch_discount: 0.5}
  gpt-5.6-luna: {input: 0.20, output: 1.20, batch_discount: 0.5}
  gpt-5-mini:   {input: 0.25, output: 2.00, batch_discount: 0.5}
  gpt-5-nano:   {input: 0.05, output: 0.40, batch_discount: 0.5}
anthropic:
  claude-sonnet-5:  {input: 2.00, output: 10.00, batch_discount: 0.5}
  claude-haiku-5-5: {input: 0.10, output: 0.50, batch_discount: 0.5}   # prompts <=100k tokens
google:
  gemini-3.8-flash:      {input: 0.75, output: 3.75, batch_discount: 0.5}  # promo price through 2026-12-31 (doubles 2027-01-01)
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50, batch_discount: 0.5}
mock:
  mock-1: {input: 0.75, output: 4.50, batch_discount: 1.0}   # priced like gpt-5.4-mini so dry runs give realistic $ figures
